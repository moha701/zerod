stance. When the updater finds per-range damage numbers, the site works shots to kill out itself, exactly, for any health. Range attachments stretch those distances.</p>")+t("2. Will you hit?",'<p style="margin:0 0 10px">Your aim slider is the share of chest shots you land at 20 m with a normal-recoil gun. From it we get your aim spread, which grows with distance. Each gun\'s recoil control and aim stability tighten or widen it, and slow bullets add lead error on moving targets.</p><p class="note" style="font-size:14.5px;color:var(--frost);margin:0">Hit chance = 1 − e<sup>−r²/2σ²</sup> · σ² = tracking² + (aim angle × distance)² + lead²</p>')+t("3. How long the kill takes",'<p style="margin:0 0 10px">Missed shots cost real fire-rate time. The number of shots needed to land N hits follows a negative binomial, so we get the whole spread of kill times, not just the average. Burst guns use their real burst timing.</p><p class="note" style="font-size:14.5px;color:var(--frost);margin:0">Fight time = aim-in and sprint-out time + pre-fire delay + shots + bullet travel + a reload if one mag is not enough</p><p style="margin:10px 0 0">How often you have to aim in or sprint out depends on your style: rushers fight from a sprint, anchors are usually pre-aimed. Snipers and marksman rifles almost always need to aim in.</p>')+t("4. Best build for your match",'<p style="margin:0">For every gun, the optimizer tries attachments one by one, then keeps swapping and removing them until nothing makes your average fight faster on that map, with your aim and style. Parts with measured effects beat estimated ones when the gain is tiny. An Apex attachment blocks its slots, and when its numbers are published the math uses the converted gun.</p>')+t("5. Win rate and the ranking",'<p style="margin:0">Each map has a fight-distance profile; your style and fight-distance setting shift it. We take the five guns that do best there with verified damage data, give each its own best build, and play every gun against them at each distance, with a little reaction-time luck on both sides. Win rate is the share of those 1v1s you win. The ranking then adjusts for two kills on one mag (important in objective modes) and mobility (important for rushers). The page also re-runs everything with worse and better aim, closer and longer fights, Hardcore and tougher enemies, and tells you if the pick would change.</p>')+t("6. Movement, flinch and reaction",'<p style="margin:0">A faster target is harder to track and lead, so mobility shows up in the duel math both ways. Each class flinches by its own amount when hit (after the Nov 13 flinch cut). Your aim test sets your reaction time: every 10 ms faster than 270 ms puts you 10 ms earlier on target in every duel.</p>')+t("7. 1v2 fights",'<p style="margin:0">After winning a fight you often face a second enemy straight away. ZEROED plays that out: you are already aimed in, you only have the ammo left in your mag (or you reload), and the first enemy\'s hits make the second one need fewer shots on you. Objective modes and Warzone weigh this more.</p>')+t("8. Warzone",'<p style="margin:0">Warzone uses its own damage: '+esc(e.wzSource||"per-range kill times from CODMunity")+". Targets have 300 health with armor, bullets are hitscan out to about 45 m, and fights run from 0 to 150 m. ZEROED builds a long-range gun and a close-range gun for each map and mode, assumes a magnified optic at long range, and only ranks guns with Warzone numbers.</p>")+t("9. Your own results",'<p style="margin:0">The match log compares your K/D with each gun against your overall K/D. After 3 matches with a gun it can move that gun\'s score by up to 8%, shrunk toward zero until there are more matches, so one great game does not take over.</p>')+t("10. Headshots",'<p style="margin:0">Set the share of your hits that land on the head. For each gun ZEROED works out the chance you need fewer shots: with N hits and a head multiplier, it counts how many head hits are needed and uses the binomial odds. Head multipliers come from patch notes where published (M4 1.35x, Han 86 1.3x, Hyeon Auto 1.4x, Wz.55 Striga 1.4x); the rest use a labeled class estimate. Damage per hit is exact when published, otherwise estimated from shots to kill.</p>')+t("11. Win-rate ranges",'<p style="margin:0">Each gun is also played with a pessimistic and an optimistic version of its uncertain numbers: damage ranges (wider for derived and estimated data), estimated handling, estimated attachment effects, and one shot more or less for guns with estimated damage. The range you see is the spread between them.</p>')+t("12. Ranked Play",'<p style="margin:0">'+esc((D.ranked||{}).note||"")+" Ranked uses 4v4 rules, slightly tougher opponents, and only the allowed guns, attachments and modes.</p>")+t("13. Per-gun attachment numbers",'<p style="margin:0">When a tracker measures an attachment on a specific gun, that gun uses its own numbers instead of the shared estimate, and the part counts as measured.</p>')+t("Data quality",'<div class="slots"><div class="slot" style="opacity:1;transform:none;grid-template-columns:auto 1fr"><span class="pill">Measured</span><span>Close-range kill time matches the TTK published by stat trackers.</span></div><div class="slot" style="opacity:1;transform:none;grid-template-columns:auto 1fr"><span class="pill med">Derived</span><span>Worked out from official patch-note damage values.</span></div><div class="slot" style="opacity:1;transform:none;grid-template-columns:auto 1fr"><span class="pill low">Estimate</span><span>Sources disagree or no damage numbers are public yet. Ranked slightly lower, never used as a benchmark gun, and always labeled.</span></div></div><p class="dim" style="font-size:13px;margin:10px 0 0">Attachment effects marked est. are our estimates; the rest were measured by stat trackers. Reload times are class estimates.</p>')+t("Automatic updates",'<p style="margin:0">Twice a day ('+esc((e.updateTimes||[e.updateHourLoca
