name: Update data

# Runs on GitHub's servers twice a day (11:41 and 23:41 Oman time), with no Claude involved.
on:
  schedule:
    - cron: "41 7,19 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only save copies of the source pages to the probe-cache branch"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        if: ${{ inputs.probe }}
        run: |
          python3 tools/probe_sources.py
          git config user.name "zeroed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-cache
          git rm -rfq --cached .
          git add probe
          git commit -qm "probe snapshot"
          git push -f origin probe-cache
